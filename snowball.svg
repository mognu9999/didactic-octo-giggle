<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="630" fill="#000"/>
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#464646" stroke-width="2"/>
  <g fill="#fff" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="36" font-weight="500" text-anchor="middle" dominant-baseline="central">
    <text x="600" y="207">Снежки — это традиционная зимняя игра, в которой</text>
    <text x="600" y="261">участники лепят из снега шары и бросают их друг в</text>
    <text x="600" y="315">друга. Это одно из самых популярных и доступных</text>
    <text x="600" y="369">развлечений в заснеженное время года,</text>
    <text x="600" y="423">объединяющее детей и взрослых.</text>
  </g>
</svg>
